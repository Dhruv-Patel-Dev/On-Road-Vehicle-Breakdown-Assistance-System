<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - On-Road Assist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #f0f4f8;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --white: #ffffff;
            --border-color: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-dark);
            display: flex;
        }

        .sidebar {
            width: 260px;
            background-color: var(--white);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .sidebar-header .logo {
            width: 32px;
            height: 32px;
            background-color: var(--primary-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
        }

        .sidebar-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .nav-menu {
            list-style: none;
            flex: 1;
        }

        .nav-item {
            margin-bottom: 0.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            color: var(--text-light);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--white);
        }

        .content-area {
            background: var(--white);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .view-header h2 {
            margin: 0;
            color: #1f2937;
        }

        .vehicles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .vehicle-card {
            background: #f9fafb;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .vehicle-card h4 {
            margin: 0 0 0.5rem 0;
            color: #1f2937;
            font-weight: 600;
        }

        .vehicle-card p {
            margin: 0 0 0.25rem 0;
            color: #6b7280;
        }

        .no-data {
            text-align: center;
            color: #6b7280;
            font-size: 1.1rem;
            padding: 3rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1rem;
        }

        .form-input:focus {
            border-color: #16a34a;
            outline: none;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <span class="logo">🚗</span>
            <h2>On-Road Assist</h2>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="dashboard-vehicle-owner.html" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i>
                    Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="my-vehicles.html" class="nav-link active">
                    <i class="fas fa-car"></i>
                    My Vehicles
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-history"></i>
                    Service History
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" onclick="showProfile(event)">
                    <i class="fas fa-user"></i>
                    Profile
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" onclick="logout(event)">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="header">
            <h1><i class="fas fa-car"></i> My Vehicles</h1>
            <button class="btn btn-primary" onclick="showAddVehicleForm()">
                <i class="fas fa-plus"></i> Add New Vehicle
            </button>
        </div>

        <div class="content-area">
            <div class="vehicles-grid" id="vehiclesGrid">
                <!-- Vehicle cards will be inserted here -->
            </div>
        </div>
    </main>

    <script>
        function loadMyVehicles() {
            fetch('../backend/get_user_vehicles.php')
            .then(response => response.json())
            .then(data => {
                console.log('Vehicle data:', data);
                const grid = document.getElementById('vehiclesGrid');
                if (data && data.length > 0) {
                    const vehiclesGrid = data.map(vehicle => `
                        <div class="vehicle-card">
                            <h4>${vehicle.vehicle_brand} ${vehicle.vehicle_model}</h4>
                            <p><strong>Plate Number:</strong> ${vehicle.number_plate}</p>
                            <p><strong>Fuel Type:</strong> ${vehicle.fuel_type}</p>
                            <p><strong>Year:</strong> ${vehicle.year}</p>
                        </div>
                    `).join('');
                    grid.innerHTML = vehiclesGrid;
                } else {
                    grid.innerHTML = `
                        <div class="no-data">
                            <i class="fas fa-car" style="font-size: 3rem; color: #d1d5db; margin-bottom: 1rem;"></i>
                            <p>No vehicles registered yet.</p>
                            <p style="margin-top: 0.5rem;">Add your first vehicle to get started.</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error loading vehicles:', error);
                document.getElementById('vehiclesGrid').innerHTML = `
                    <div class="no-data">
                        <p>Error loading vehicles. Please try again.</p>
                    </div>
                `;
            });
        }

        function showAddVehicleForm() {
            const modal = document.createElement('div');
            modal.id = 'addVehicleModal';
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.5);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
            `;
            
            modal.innerHTML = `
                <div style="
                    background: white;
                    padding: 2rem;
                    border-radius: 12px;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                    max-width: 500px;
                    width: 90%;
                ">
                    <h3 style="margin: 0 0 1.5rem 0; color: #1f2937; text-align: center;">Add New Vehicle</h3>
                    
                    <form id="addVehicleForm">
                        <div class="form-group">
                            <label for="vehicleType">Vehicle Type</label>
                            <input type="text" id="vehicleType" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="vehicleBrand">Vehicle Brand</label>
                            <input type="text" id="vehicleBrand" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="vehicleModel">Vehicle Model</label>
                            <input type="text" id="vehicleModel" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="numberPlate">Number Plate</label>
                            <input type="text" id="numberPlate" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="fuelType">Fuel Type</label>
                            <input type="text" id="fuelType" class="form-input" required>
                        </div>
                        
                        <div style="display: flex; gap: 12px; justify-content: flex-end;">
                            <button type="button" onclick="closeAddVehicleModal()" style="
                                padding: 10px 20px;
                                border: 2px solid #d1d5db;
                                background: white;
                                border-radius: 6px;
                                cursor: pointer;
                                color: #374151;
                            ">Cancel</button>
                            
                            <button type="submit" style="
                                padding: 10px 20px;
                                border: none;
                                background: #16a34a;
                                color: white;
                                border-radius: 6px;
                                cursor: pointer;
                                font-weight: bold;
                            ">Add Vehicle</button>
                        </div>
                    </form>
                </div>
            `;
            
            document.body.appendChild(modal);

            document.getElementById('addVehicleForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const data = {
                    vehicle_type: document.getElementById('vehicleType').value,
                    vehicle_brand: document.getElementById('vehicleBrand').value,
                    vehicle_model: document.getElementById('vehicleModel').value,
                    number_plate: document.getElementById('numberPlate').value,
                    fuel_type: document.getElementById('fuelType').value,
                };
                try {
                    const res = await fetch('../backend/add_vehicle.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await res.json();
                    if (result.success) {
                        alert('Vehicle added successfully!');
                        closeAddVehicleModal();
                        loadMyVehicles();
                    } else {
                        alert('Error: ' + result.error);
                    }
                } catch (err) {
                    alert('Failed to add vehicle.');
                }
            });
        }

        function closeAddVehicleModal() {
            const modal = document.getElementById('addVehicleModal');
            if (modal) {
                modal.remove();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadMyVehicles();
        });
    </script>
</body>
</html>
